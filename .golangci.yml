version: "2"
run:
  issues-exit-code: 1
linters:
  enable:
    - asciicheck
    - bodyclose
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - importas
    - makezero
    - misspell
    - nilnesserr
    - prealloc
    - revive
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    forbidigo:
      forbid:
        # Forbid using os.Getenv and os.LookupEnv with COSIGN_ variables in favor of
        # pkg/cosign/env package
        # Reference: https://github.com/sigstore/cosign/issues/2236
        - pattern: os\.Getenv.*
        - pattern: os\.LookupEnv.*
      exclude-godoc-examples: false
    gosec:
      excludes:
        - G115 # integer overflow conversion int64 -> uint64
    govet:
      settings:
        printf:
          funcs:
            - github.com/sigstore/cosign/v2/internal/ui.Infof
            - github.com/sigstore/cosign/v2/internal/ui.Warnf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          # We want to allow using os.Getenv and os.Setenv in tests because it
          # might be easier (and needed in some cases)
          - forbidigo
          - gosec
        path: _test\.go
      - linters:
          - staticcheck
        path: pkg/cosign/tlog.go
        # NewEntry used for Rekor v1, will update to NewTlogEntry for Rekor v2 support
        text: SA1019
      - linters:
          - staticcheck
        path: pkg/cosign/verify.go
        # NewEntry used for Rekor v1, will update to NewTlogEntry for Rekor v2 support
        text: SA1019
      - linters:
          - staticcheck
        path: pkg/cosign/verify_bundle_test.go
        # NewEntry used for Rekor v1, will update to NewTlogEntry for Rekor v2 support
        text: SA1019
      # The rules below exclude findings from checks that were added to
      # golangci-lint after v2.4, in code that predates them. They let this
      # maintenance branch use a linter that supports Go 1.27 without
      # changing unrelated code.
      - linters:
          - prealloc
        text: Consider preallocating
      - linters:
          - gocritic
        text: "deprecatedComment:"
      - linters:
          - gosec
        path: cmd/conformance/main\.go|cmd/cosign/cli/bundle/bundle\.go|cmd/cosign/cli/sign/sign\.go
        # Taint-analysis rules (command injection, path traversal, log injection)
        text: "G70[236]:"
      - linters:
          - staticcheck
        path: internal/pkg/cosign/tsa/client/client\.go
        text: 'SA1019: \(net\.Dialer\)\.DualStack'
      - linters:
          - staticcheck
        path: pkg/cosign/pkcs11key/util\.go
        text: "QF1012:"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
