project_name: cosign
version: 2

env:
  - GO111MODULE=on
  - CGO_ENABLED=1
  - DOCKER_CLI_EXPERIMENTAL=enabled
  - COSIGN_YES=true

# Prevents parallel builds from stepping on each others toes downloading modules
before:
  hooks:
    - go mod tidy
    - git --no-pager diff --exit-code go.mod go.sum

gomod:
  proxy: true

sboms:
  - artifacts: binary

builds:
  - id: linux
    binary: cosign-linux-{{ .Arch }}
    no_unique_dist_dir: true
    main: ./cmd/cosign
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
      - s390x
      - ppc64le
      - riscv64
    goarm:
      - '7'
    ldflags:
      - "{{ .Env.LDFLAGS }}"
    env:
      - CGO_ENABLED=0

  - id: linux-pivkey-pkcs11key-amd64
    binary: cosign-linux-pivkey-pkcs11key-amd64
    no_unique_dist_dir: true
    main: ./cmd/cosign
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - "{{ .Env.LDFLAGS }}"
    tags:
      - pivkey
      - pkcs11key
    hooks:
      pre:
        - apt-get update
        - apt-get -y install --no-install-recommends libpcsclite-dev
    env:
      - CC=zig cc -target x86_64-linux-gnu.2.34
      - CXX=zig c++ -target x86_64-linux-gnu.2.34
      # -idirafter: zig cc does not search /usr/include, but libpcsclite's headers
      # are included as <PCSC/winscard.h> so the parent dir must be on the path.
      # It must come *after* zig's own headers, otherwise Debian's glibc headers
      # shadow zig's and conflict when building runtime/cgo.
      # -fno-sanitize=undefined: zig cc enables UBSan by default, but its runtime
      # is not linked in, leaving __ubsan_handle_* undefined at link time.
      - CGO_CFLAGS=-idirafter /usr/include -fno-sanitize=undefined
      - CGO_LDFLAGS=-L/usr/lib/x86_64-linux-gnu
      - PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig/

  - id: linux-pivkey-pkcs11key-arm64
    binary: cosign-linux-pivkey-pkcs11key-arm64
    no_unique_dist_dir: true
    main: ./cmd/cosign
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - "{{ .Env.LDFLAGS }}"
    tags:
      - pivkey
      - pkcs11key
    hooks:
      pre:
        - dpkg --add-architecture arm64
        - apt-get update
        - apt-get install -y --no-install-recommends libpcsclite-dev:arm64
    env:
      - CC=zig cc -target aarch64-linux-gnu.2.34
      - CXX=zig c++ -target aarch64-linux-gnu.2.34
      # See the notes on the amd64 build above for why these flags are needed.
      - CGO_CFLAGS=-idirafter /usr/include -fno-sanitize=undefined
      - CGO_LDFLAGS=-L/usr/lib/aarch64-linux-gnu
      - PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/

  - id: darwin-amd64
    binary: cosign-darwin-amd64
    no_unique_dist_dir: true
    env:
      - CC=zig cc -target x86_64-macos
      - CXX=zig c++ -target x86_64-macos
      # zig does not auto-attach the macOS SDK, so point it at the one the image
      # ships. -isystem/-iframework (rather than -I/-F) mark the SDK as system
      # headers, which suppresses warnings zig cc otherwise promotes to errors.
      - CGO_CFLAGS=-isysroot {{ .Env.OSX_SDK_PATH }} -isystem {{ .Env.OSX_SDK_PATH }}/usr/include -iframework {{ .Env.OSX_SDK_PATH }}/System/Library/Frameworks -mmacosx-version-min=11.0
      - CGO_LDFLAGS=-isysroot {{ .Env.OSX_SDK_PATH }} -L{{ .Env.OSX_SDK_PATH }}/usr/lib -F{{ .Env.OSX_SDK_PATH }}/System/Library/Frameworks
    main: ./cmd/cosign
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      # -s -w skips dsymutil, which is not shipped in the zig builder image
      - -s
      - -w
      - "{{ .Env.LDFLAGS }}"
    tags:
      - pivkey
      - pkcs11key

  - id: darwin-arm64
    binary: cosign-darwin-arm64
    no_unique_dist_dir: true
    env:
      - CC=zig cc -target aarch64-macos
      - CXX=zig c++ -target aarch64-macos
      # zig does not auto-attach the macOS SDK, so point it at the one the image
      # ships. -isystem/-iframework (rather than -I/-F) mark the SDK as system
      # headers, which suppresses warnings zig cc otherwise promotes to errors.
      - CGO_CFLAGS=-isysroot {{ .Env.OSX_SDK_PATH }} -isystem {{ .Env.OSX_SDK_PATH }}/usr/include -iframework {{ .Env.OSX_SDK_PATH }}/System/Library/Frameworks -mmacosx-version-min=11.0
      - CGO_LDFLAGS=-isysroot {{ .Env.OSX_SDK_PATH }} -L{{ .Env.OSX_SDK_PATH }}/usr/lib -F{{ .Env.OSX_SDK_PATH }}/System/Library/Frameworks
    main: ./cmd/cosign
    flags:
      - -trimpath
    goos:
      - darwin
    goarch:
      - arm64
    tags:
      - pivkey
      - pkcs11key
    ldflags:
      # -s -w skips dsymutil, which is not shipped in the zig builder image
      - -s
      - -w
      - "{{.Env.LDFLAGS}}"

  - id: windows-amd64
    binary: cosign-windows-amd64
    no_unique_dist_dir: true
    env:
      - CC=zig cc -target x86_64-windows-gnu
      - CXX=zig c++ -target x86_64-windows-gnu
    main: ./cmd/cosign
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -buildmode=exe
      - "{{ .Env.LDFLAGS }}"
    tags:
      - pivkey
      - pkcs11key

signs:
  - id: cosign
    cmd: ./dist/cosign-linux-amd64
    args: ["sign-blob", "--bundle", "${signature}", "--key", "gcpkms://projects/{{ .Env.PROJECT_ID }}/locations/{{ .Env.KEY_LOCATION }}/keyRings/{{ .Env.KEY_RING }}/cryptoKeys/{{ .Env.KEY_NAME }}/versions/{{ .Env.KEY_VERSION }}", "${artifact}"]
    signature: "${artifact}-kms.sigstore.json"
    artifacts: binary
  # Keyless
  - id: cosign-keyless
    cmd: ./dist/cosign-linux-amd64
    args: ["sign-blob", "--bundle", "${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"
    artifacts: binary
  - id: checksum-keyless
    cmd: ./dist/cosign-linux-amd64
    args: ["sign-blob", "--bundle", "${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
  - id: packages-keyless
    cmd: ./dist/cosign-linux-amd64
    args: ["sign-blob", "--bundle", "${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"
    artifacts: package

nfpms:
  - id: cosign
    package_name: cosign
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Sigstore
    homepage: https://sigstore.dev
    maintainer: Sigstore Authors 86837369+sigstore-bot@users.noreply.github.com
    ids:
      - linux
    description: Container Signing, Verification and Storage in an OCI registry.
    license: "Apache License 2.0"
    formats:
      - apk
      - deb
      - rpm
    contents:
      - src: /usr/bin/cosign-linux-{{ .Arch }}
        dst: /usr/bin/cosign
        type: "symlink"

archives:
  - formats: [binary]
    name_template: "{{ .Binary }}"
    allow_different_binary_count: true

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

snapshot:
  version_template: SNAPSHOT-{{ .ShortCommit }}

release:
  prerelease: allow # remove this when we start publishing non-prerelease or set to auto
  draft: true # allow for manual edits
  github:
    owner: sigstore
    name: cosign
  footer: |
    ### Thanks to all contributors!

  extra_files:
    - glob: "./release/release-cosign.pub"
